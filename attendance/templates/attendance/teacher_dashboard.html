<!DOCTYPE html>
<html>
<head>
    <title>Hoca QR Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; }
        .qr-block { margin-bottom: 20px; }

        /* Fade animasyonu */
        #qrImage {
            transition: opacity 0.4s ease-in-out;
        }

        .export-button {
            padding:10px 20px; background-color:#4CAF50; color:white;
            text-decoration:none; border-radius:5px; display:inline-block;
        }
        .export-button:hover { background-color:#45a049; }
    </style>
</head>
<body>
    <h2>Yoklama Oturumunuz</h2>

    <div class="qr-block">
        <img id="qrImage" src="data:image/png;base64,{{ qr_code_b64 }}" alt="QR Kod">
        <div>
            <a id="exportBtn" href="{% url 'export_attendance' session.id %}" class="export-button">
                📥 Excel İndir
            </a>
        </div>
    </div>

    <p>QR kod her 5 saniyede bir otomatik yenilenir.</p>

    <script>
        function refreshQR() {

            // Fade out
            const qrImg = document.getElementById("qrImage");
            qrImg.style.opacity = 0;  

            fetch("/attendance/refresh_qr/")
                .then(res => res.json())
                .then(data => {

                    // Yavaşça kaybolduktan sonra QR güncelle
                    setTimeout(() => {
                        qrImg.src = "data:image/png;base64," + data.qr_code_b64;

                        // Excel indir linkini güncelle
                        document.getElementById("exportBtn").href =
                            "/attendance/export/" + data.session_id + "/";

                        // Yeniden görünür yap
                        qrImg.style.opacity = 1;
                    }, 400);
                });
        }

        // Her 5 saniyede yenile
        setInterval(refreshQR, 5000);
    </script>

</body>
</html>
