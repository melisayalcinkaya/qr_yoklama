# Yerelde production'a benzer ortam: Django + Gunicorn + PostgreSQL
# Çalıştırmak için: docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qr_yoklama
      POSTGRES_USER: qr_yoklama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yerel-gelistirme-sifresi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr_yoklama"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-yerel-docker-icin-degistirin}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      # Yerelde HTTPS olmadığı için kapalı; canlı ortamda açık kalmalı.
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://qr_yoklama:${POSTGRES_PASSWORD:-yerel-gelistirme-sifresi}@db:5432/qr_yoklama
      DJANGO_SEED_DEMO: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
