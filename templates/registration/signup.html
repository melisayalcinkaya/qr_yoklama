{% extends "base.html" %}
{% block title %}Hesap oluştur · QR Yoklama{% endblock %}
{% block content %}
<section class="sheet narrow">
    <h1>Öğretmen hesabı oluştur</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Hesap oluştur</button>
    </form>
    <p class="muted small" style="margin-top:16px">Zaten hesabınız var mı? <a href="{% url 'login' %}">Giriş yapın</a></p>
</section>
{% endblock %}
